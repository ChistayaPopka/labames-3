{% load static %}<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}Объявления{% endblock %} · Барахолка</title>
  <link rel="stylesheet" href="{% static 'css/style.css' %}">
</head>
<body>
  <header class="site-header">
    <div class="container header-inner">
      <a class="logo" href="{% url 'ads:list' %}">Барахолка</a>
      <nav class="nav">
        {% if user.is_authenticated %}
          <a href="{% url 'ads:my' %}">Мои объявления</a>
          <a href="{% url 'ads:favorites' %}">Избранное</a>
          <a class="btn btn-primary" href="{% url 'ads:create' %}">+ Разместить</a>
          <form class="inline-form" method="post" action="{% url 'logout' %}">
            {% csrf_token %}
            <button class="link-button" type="submit">Выйти ({{ user.username }})</button>
          </form>
        {% else %}
          <a href="{% url 'login' %}">Войти</a>
          <a class="btn btn-primary" href="{% url 'signup' %}">Регистрация</a>
        {% endif %}
      </nav>
    </div>
  </header>

  <main class="container">
    {% for message in messages %}
      <div class="alert alert-{{ message.tags }}">{{ message }}</div>
    {% endfor %}
    {% block content %}{% endblock %}
  </main>

</body>
</html>
