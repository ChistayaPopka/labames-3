{% extends "base.html" %}

{% block title %}Регистрация{% endblock %}

{% block content %}
<div class="narrow narrow-sm">
  <h1>Регистрация</h1>
  <form method="post" class="panel">
    {% csrf_token %}
    {% include "_form.html" with form=form %}
    <button class="btn btn-primary btn-block" type="submit">Создать аккаунт</button>
  </form>
  <p class="muted">Уже есть аккаунт? <a href="{% url 'login' %}">Войдите</a></p>
</div>
{% endblock %}
